# Rainwise MK3-LR logger for TrueNAS (Apps > Discover > ⋮ menu > Install via YAML)
# https://apps.truenas.com/managing-apps/installing-custom-apps/
#
# Before installing:
#   1. Create a dataset, e.g. /mnt/tank/apps/rainwise
#   2. Copy rainwise_service.py into it
#   3. Change the two host paths below if your pool/dataset differ
#   4. Plug in the receiver and check its name: ls /dev/serial/by-id/
#        XBee USB breakout (CP2102 chip): usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_...-port0
#        LoRa receiver (RAK4631, raw mode):  usb-RAKwireless_WisCore_RAK4631_Board_<serial>-if00
#      Both send the same 32-byte packets, so switching later only changes the
#      left side of the devices: line; the database carries on.
services:
  rainwise:
    image: python:3.12-slim
    container_name: rainwise
    restart: unless-stopped
    command: >
      sh -c "pip install --quiet --no-cache-dir pyserial==3.5 &&
             python -u /app/rainwise_service.py"
    environment:
      TZ: UTC                              # set to your time zone, e.g. America/Chicago
      SERIAL_PORT: /dev/rainwise           # name inside the container (devices: below); "" to disable
                                           # several receivers (one per frequency): /dev/rainwise,/dev/rainwise2
      BAUD: "9600"                         # ignored by the RAK's USB port; used by an XBee breakout
      UDP_PORT: "5005"                     # network receiver (packets over UDP); "0" to disable
      XML_URL: http://192.168.1.1/status.xml   # your IP-100's address; "" to disable
      XML_INTERVAL: "60"
      DB_PATH: /data/rainwise.db
      STATUS_KEEP_DAYS: "0"                # station status (metadata) kept this many days; 0 = forever
      ELEVATION_FT: "0"                    # barometer height above sea level, in feet; 0 = no correction
      BARO_OFFSET: "0"                     # inHg, fine-tune against a nearby airport
    volumes:
      - /mnt/tank/apps/rainwise:/app:ro
      - /mnt/tank/apps/rainwise:/data
    devices:
      # Left side: the host's device (a /dev/serial/by-id/... path stays
      # stable across reboots). Right side: the name the script uses.
      - /dev/serial/by-id/usb-RAKwireless_WisCore_RAK4631_Board_<serial>-if00:/dev/rainwise
      # A second LoRa receiver (another frequency), with SERIAL_PORT listing both:
      # - /dev/serial/by-id/usb-RAKwireless_WisCore_RAK4631_Board_<serial2>-if00:/dev/rainwise2
      # XBee USB breakout instead:
      # - /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0:/dev/rainwise
    ports:
      - "5005:5005/udp"
