; Rainwise LoRa link firmware (see README.md).
; Two environments build the same sketch in each role:
;   pio run -e station -t upload      pio run -e receiver -t upload
; The RAK4631 board files in rakwireless/ come from RAK's RAK_PATCH_V2:
; https://github.com/RAKWireless/WisBlock/tree/master/PlatformIO

[platformio]
src_dir = rainwise_lora
boards_dir = rakwireless/boards
default_envs = station, receiver

[env]
platform = nordicnrf52
board = rak4630
framework = arduino
build_src_filter = +<*> +<../rakwireless/variants/rak4630>
build_flags = -I rakwireless/variants/rak4630
lib_deps = jgromes/RadioLib@7.8.1
monitor_speed = 115200

[env:station]
build_flags = ${env.build_flags} -DROLE=ROLE_STATION

[env:receiver]
build_flags = ${env.build_flags} -DROLE=ROLE_RECEIVER
